<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0F172A"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#grad1)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="#10B981" opacity="0.1"/>
  <circle cx="1050" cy="650" r="100" fill="#059669" opacity="0.15"/>
  <circle cx="900" cy="200" r="60" fill="#34D399" opacity="0.1"/>
  
  <!-- Main content -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#grad2)" text-anchor="middle">
    The Nikah Nest
  </text>
  
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="28" fill="#94A3B8" text-anchor="middle">
    Islamic Wedding Vendor Platform
  </text>
  
  <!-- Feature boxes -->
  <rect x="200" y="420" width="240" height="140" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="320" y="470" font-family="Arial, sans-serif" font-size="48" fill="#10B981" text-anchor="middle">37+</text>
  <text x="320" y="510" font-family="Arial, sans-serif" font-size="18" fill="#CBD5E1" text-anchor="middle">Verified</text>
  <text x="320" y="535" font-family="Arial, sans-serif" font-size="18" fill="#CBD5E1" text-anchor="middle">Vendors</text>
  
  <rect x="480" y="420" width="240" height="140" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="48" fill="#10B981" text-anchor="middle">5.0★</text>
  <text x="600" y="510" font-family="Arial, sans-serif" font-size="18" fill="#CBD5E1" text-anchor="middle">Average</text>
  <text x="600" y="535" font-family="Arial, sans-serif" font-size="18" fill="#CBD5E1" text-anchor="middle">Rating</text>
  
  <rect x="760" y="420" width="240" height="140" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="880" y="470" font-family="Arial, sans-serif" font-size="48" fill="#10B981" text-anchor="middle">20+</text>
  <text x="880" y="510" font-family="Arial, sans-serif" font-size="18" fill="#CBD5E1" text-anchor="middle">Happy</text>
  <text x="880" y="535" font-family="Arial, sans-serif" font-size="18" fill="#CBD5E1" text-anchor="middle">Couples</text>
  
  <!-- Tech stack -->
  <text x="600" y="640" font-family="Arial, sans-serif" font-size="16" fill="#64748B" text-anchor="middle">
    Next.js • TypeScript • Tailwind CSS • Framer Motion
  </text>
  
  <!-- URL -->
  <text x="600" y="700" font-family="Arial, sans-serif" font-size="20" fill="#10B981" text-anchor="middle">
    thenikahnest.com
  </text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="700" r="4" fill="#10B981"/>
  <circle cx="1100" cy="100" r="4" fill="#34D399"/>
  <circle cx="150" cy="600" r="3" fill="#059669"/>
  <circle cx="1050" cy="300" r="3" fill="#10B981"/>
</svg>
